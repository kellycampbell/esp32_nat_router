; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
default_envs = esp32-s3-halow

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board_build.partitions = partitions_example.csv
monitor_filters = direct
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:esp32-s3]
board = esp32s3box

[env:esp32-s3-halow]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_8mb.csv
; halow_sdkconfig layers sdkconfig.defaults.halow (and the board profile
; below) onto sdkconfig.defaults via the SDKCONFIG_DEFAULTS env var;
; pioarduino's custom_sdkconfig option only works under the Arduino framework,
; not espidf. halow_cmake_artifacts then runs the morsemicro__halow custom
; CMake steps (BCF .mbin conversion, mangled libmorse.a) that pioarduino's
; SCons-based build never executes on its own.
extra_scripts =
    pre:scripts/halow_sdkconfig.py
    post:scripts/halow_cmake_artifacts.py
custom_halow_profile = managed_components/morsemicro__halow/configs/sdkconfig.defaults.seeed_xiao_esp32s3-seeed_xiao_mm6108

; [env:esp32-s3-debug]
; extends = env:esp32-s3
; upload_protocol = esp-builtin
; debug_tool = esp-builtin
; build_type = debug

[env:wt32-eth01]
board = esp32dev
board_build.extra_flags =
    -DCONFIG_ETH_UPLINK=1
    -DCONFIG_ETH_MDC_GPIO=23
    -DCONFIG_ETH_MDIO_GPIO=18
    -DCONFIG_ETH_PHY_ADDR=1
    -DCONFIG_ETH_PHY_POWER_GPIO=16
